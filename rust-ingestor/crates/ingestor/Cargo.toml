[package]
name = "ingestor"
version = "1.1.0"
edition = "2021"
rust-version = "1.82"
description = "Retail Pricing Intelligence Peru (E1) multi-retailer Bronze ingestor"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "http2", "charset"] }
governor = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arrow = "53"
parquet = { version = "53", features = ["arrow", "zstd"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
